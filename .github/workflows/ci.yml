name: CI

on:
  push:
    branches:
      - main
      - renovate/*
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - windows-11-arm
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build OpenBackupManager.slnx

      - name: Test
        run: dotnet test OpenBackupManager.slnx --no-build

  format:
    name: Format
    runs-on: windows-latest # Formatting the Windows-only projects needs them to load
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Format
        run: |
          dotnet format whitespace OpenBackupManager.slnx
          dotnet format style OpenBackupManager.slnx --severity info
          dotnet format analyzers OpenBackupManager.slnx

      - name: Check for changes
        shell: bash
        run: |
          git diff --quiet && exit 0
          {
            echo "## Formatting needed"
            echo
            echo "Run these from the repo root:"
            echo
            echo '```sh'
            echo 'dotnet format whitespace OpenBackupManager.slnx'
            echo 'dotnet format style OpenBackupManager.slnx --severity info'
            echo 'dotnet format analyzers OpenBackupManager.slnx'
            echo '```'
            echo
            echo "To format automatically on every commit, run \`git config core.hooksPath .githooks\` once."
            echo
            echo '```diff'
            git diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Some files aren't formatted: the run summary shows the changes and how to fix them"
          exit 1

  all-checks:
    name: All checks
    if: always()
    needs: [test, format]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {} # Only reads needs.*.result
    steps:
      - name: Check every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
