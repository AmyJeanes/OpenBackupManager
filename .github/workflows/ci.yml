name: CI

on:
  push:
    branches:
      - main
      - renovate/*
    tags:
      - v*
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows-only:
        description: Only test on Windows
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(inputs.windows-only
            && '["windows-latest", "windows-11-arm"]'
            || '["windows-latest", "windows-11-arm", "ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "macos-26-intel"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build OpenBackupManager.slnx

      - name: Clear the desktop
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/Clear-Desktop.ps1

      - name: Test
        run: dotnet test OpenBackupManager.slnx --no-build --results-directory TestResults --logger trx

      # With the UI tests' screenshots of the screen when they failed
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

  # Replaces the installed app, so it only runs here
  install:
    name: Install and update (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: windows-11-arm
            runtime: win-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      # A feed for each version, holding it and those before it, so the test can add them one at a time
      - name: Pack test versions
        shell: pwsh
        run: |
          New-Item test-releases -ItemType Directory | Out-Null
          foreach ($version in '0.0.1', '0.0.2', '0.0.3') {
              ./tools/Publish-TestUpdate.ps1 -Version $version -Runtime ${{ matrix.runtime }} -Feed releases
              Copy-Item releases "test-releases/$version" -Recurse
          }

      - name: Build
        run: dotnet build tests/OpenBackupManager.App.Windows.UITests

      - name: Clear the desktop
        shell: pwsh
        run: ./.github/scripts/Clear-Desktop.ps1

      - name: Test
        run: dotnet test tests/OpenBackupManager.App.Windows.UITests --no-build --filter Category=Install --results-directory TestResults --logger trx
        env:
          OBM_TEST_RELEASES: ${{ github.workspace }}/test-releases

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: install-test-results-${{ matrix.os }}
          path: TestResults

  format:
    name: Format
    runs-on: windows-latest # Formatting the Windows-only projects needs them to load
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Format
        run: |
          dotnet format whitespace OpenBackupManager.slnx
          dotnet format style OpenBackupManager.slnx --severity info
          dotnet format analyzers OpenBackupManager.slnx

      - name: Check for changes
        shell: bash
        run: |
          git diff --quiet && exit 0
          {
            echo "## Formatting needed"
            echo
            echo "Run these from the repo root:"
            echo
            echo '```sh'
            echo 'dotnet format whitespace OpenBackupManager.slnx'
            echo 'dotnet format style OpenBackupManager.slnx --severity info'
            echo 'dotnet format analyzers OpenBackupManager.slnx'
            echo '```'
            echo
            echo "To format automatically on every commit, run \`git config core.hooksPath .githooks\` once."
            echo
            echo '```diff'
            git diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Some files aren't formatted: the run summary shows the changes and how to fix them"
          exit 1

  # Each architecture is its own Velopack channel, so an install only updates to its own build. Both go into one
  # draft release, which is published by hand once its notes are written
  release:
    name: Release (${{ matrix.runtime }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, install, format]
    runs-on: windows-latest
    permissions:
      contents: write # Creates the draft release
    strategy:
      max-parallel: 1 # One at a time, so the second adds to the draft the first created
      matrix:
        runtime: [win-x64, win-arm64]
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      TAG: ${{ github.ref_name }}
      RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Work out the version
        run: |
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          # A version with a '-', such as 0.1.0-alpha.1, is a prerelease
          if [[ $TAG == *-* ]]; then echo "PRERELEASE=--pre" >> "$GITHUB_ENV"; fi

      - name: Publish
        run: >
          dotnet publish src/OpenBackupManager.App.Windows
          --configuration Release
          --runtime $RUNTIME
          --self-contained
          -p:Version=$VERSION
          --output publish

      # So the update from it to this one can be a small delta
      - name: Download the previous release
        run: >
          dotnet vpk download github
          --repoUrl $REPO_URL
          --token $GH_TOKEN
          --channel $RUNTIME
          $PRERELEASE
          --outputDir releases

      - name: Pack
        run: >
          dotnet vpk pack
          --packId OpenBackupManager.App
          --packVersion $VERSION
          --packTitle OpenBackupManager
          --packAuthors "Amy Jeanes"
          --packDir publish
          --mainExe OpenBackupManager.App.Windows.exe
          --icon src/OpenBackupManager.App.Windows/Assets/AppIcon.ico
          --shortcuts StartMenuRoot
          --noPortable
          --runtime $RUNTIME
          --channel $RUNTIME
          --outputDir releases

      - name: Upload to the draft release
        run: >
          dotnet vpk upload github
          --repoUrl $REPO_URL
          --token $GH_TOKEN
          --channel $RUNTIME
          $PRERELEASE
          --tag $TAG
          --releaseName "Release $TAG"
          --merge
          --outputDir releases

  all-checks:
    name: All checks
    if: always()
    needs: [test, install, format]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {} # Only reads needs.*.result
    steps:
      - name: Check every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
