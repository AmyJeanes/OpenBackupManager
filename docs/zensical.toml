# The user guide's site, built from docs/guide. CONTRIBUTING.md has how to preview it
[project]
site_name = "Open Backup Manager"
site_description = "Open-source backup and two-way sync for your folders"
site_url = "https://amyjeanes.github.io/OpenBackupManager/"
repo_url = "https://github.com/AmyJeanes/OpenBackupManager"
repo_name = "GitHub"
edit_uri = "edit/main/docs/guide/"
copyright = "Copyright &copy; 2026 Amy Jeanes. MIT License"
docs_dir = "guide"
site_dir = "site"
strict = true
extra_css = ["assets/colours.css"]
# Each new page goes here too, or it's left out of the sidebar
nav = [
  { "Home" = "README.md" },
  { "Getting started" = "getting-started.md" },
  { "Settings" = "settings.md" },
  { "Updates" = "updates.md" },
  { "Files and folders" = "files.md" },
  { "Command line" = "command-line.md" },
  { "Checking a download" = "checking-downloads.md" },
  { "Privacy" = "privacy.md" },
]

[project.theme]
language = "en"
custom_dir = "overrides"
logo = "assets/logo.png"
favicon = "assets/logo.png"
# The device's own fonts, so visitors' browsers don't fetch them from Google
font = false
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.extra]
generator = false
social = [
  { icon = "fontawesome/brands/github", link = "https://github.com/AmyJeanes/OpenBackupManager", name = "Open Backup Manager on GitHub" },
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
